[tool.poetry]
name = "talentleads"
version = "0.1.0"
description = "Find the Best Talent for Your Startup"
authors = ["Rasul Kireev <me@rasulkireev.com>"]

[tool.poetry.dependencies]
python = "^3.13"
django = "^6.0.5"
python-webpack-boilerplate = "^1.0.4"
django-widget-tweaks = "^1.5.1"
psycopg2 = "^2.9.12"
django-model-utils = "^5.0.0"
croniter = "^6.2.2"
django-autoslug = "^1.9.9"
markdown = "^3.10.2"
gunicorn = "^26.0.0"
pillow = "^12.2.0"
django-extensions = "^4.1"
django-filter = "^25.2"
django-anymail = {extras = ["mailgun"], version = "^15.0"}
pygments = "^2.20.0"
whitenoise = "^6.12.0"
django-taggit = "^6.1.0"
django-modelcluster = "^6.5"
libgravatar = "^1.0.4"
django-storages = "^1.14.6"
boto3 = "^1.43.16"
redis = {extras = ["hiredis"], version = "^8.0.0"}
openai = "^2.38.0"
sentry-sdk = "^2.61.0"
structlog-sentry = "^2.2.1"
django-structlog = "^10.0.0"
structlog = "^25.5.0"
django-q2 = "^1.10.0"
django-allauth = "^65.17.0"
django-environ = "^0.13.0"
dj-stripe = "^2.10.3"
pgvector = "^0.4.2"
pydantic-ai = "^1.103.0"
httpx = "^0.28.1"
logfire = "^4.34.0"
ipython = "^9.13.0"
stripe = "^15.2.0"
django-ninja = "^1.6.2"

[tool.poetry.group.dev.dependencies]
pre-commit = "^4.6.0"
djlint = "^1.36.4"
ruff = "^0.15.15"
ty = "^0.0.40"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.isort]
profile = "django"
combine_as_imports = true
include_trailing_comma = true
line_length = 120
multi_line_output = 3

[tool.black]
line-length = 120
target-version = ['py39']
include = '\.pyi?$'

[tool.djlint]
profile="django"
ignore = "H031,H006,H023,H011"

[tool.ruff]
line-length = 120
