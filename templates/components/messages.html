{% if messages %}
    <div class="fixed inset-x-0 top-4 z-50 px-4">
        <div class="mx-auto grid max-w-3xl gap-2">
            {% for message in messages %}
                {% if message.level == DEFAULT_MESSAGE_LEVELS.WARNING %}
                    <div data-controller="reveal"
                         data-reveal-target="item"
                         class="flex items-start justify-between gap-4 rounded-lg border border-red-200 bg-red-50 px-4 py-3 text-red-900 shadow-sm">
                        <p class="text-sm font-medium">{{ message }}</p>
                        <button data-action="click->reveal#hide"
                                type="button"
                                class="rounded-md p-1 text-red-700 hover:bg-red-100 focus:outline-none focus:ring-2 focus:ring-red-500">
                            <span class="sr-only">Dismiss</span>
                            <svg class="h-5 w-5"
                                 xmlns="http://www.w3.org/2000/svg"
                                 fill="none"
                                 viewBox="0 0 24 24"
                                 stroke-width="2"
                                 stroke="currentColor"
                                 aria-hidden="true">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12" />
                            </svg>
                        </button>
                    </div>
                {% else %}
                    <div data-controller="reveal"
                         data-reveal-target="item"
                         class="flex items-start justify-between gap-4 rounded-lg border border-emerald-200 bg-emerald-50 px-4 py-3 text-emerald-950 shadow-sm">
                        <p class="text-sm font-medium">{{ message }}</p>
                        <button data-action="click->reveal#hide"
                                type="button"
                                class="rounded-md p-1 text-emerald-800 hover:bg-emerald-100 focus:outline-none focus:ring-2 focus:ring-emerald-600">
                            <span class="sr-only">Dismiss</span>
                            <svg class="h-5 w-5"
                                 xmlns="http://www.w3.org/2000/svg"
                                 fill="none"
                                 viewBox="0 0 24 24"
                                 stroke-width="2"
                                 stroke="currentColor"
                                 aria-hidden="true">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12" />
                            </svg>
                        </button>
                    </div>
                {% endif %}
            {% endfor %}
        </div>
    </div>
{% endif %}
