{% if not email_verified %}
    <div class="my-4 rounded-lg border border-amber-200 bg-amber-50 p-4 text-amber-950">
        <div class="flex gap-3">
            <div class="flex h-9 w-9 flex-shrink-0 items-center justify-center rounded-lg bg-amber-100 text-amber-800">
                <svg class="h-5 w-5"
                     xmlns="http://www.w3.org/2000/svg"
                     viewBox="0 0 20 20"
                     fill="currentColor"
                     aria-hidden="true">
                    <path fill-rule="evenodd" d="M8.485 3.495c.673-1.167 2.357-1.167 3.03 0l6.28 10.875c.673 1.167-.17 2.625-1.516 2.625H3.72c-1.347 0-2.189-1.458-1.515-2.625L8.485 3.495zM10 6a.75.75 0 01.75.75v3.5a.75.75 0 01-1.5 0v-3.5A.75.75 0 0110 6zm0 9a1 1 0 100-2 1 1 0 000 2z" clip-rule="evenodd" />
                </svg>
            </div>
            <div>
                <h3 class="text-sm font-semibold">Confirm your email</h3>
                <div class="mt-1 space-y-1 text-sm leading-6 text-amber-900">
                    <p>Your account is usable, but some functionality stays limited until your email is confirmed.</p>
                    <p>
                        If the confirmation link did not arrive,
                        <a class="font-semibold underline underline-offset-4"
                           href="{% url 'resend_email_confirmation_email' %}">send it again</a>.
                    </p>
                </div>
            </div>
        </div>
    </div>
{% endif %}
