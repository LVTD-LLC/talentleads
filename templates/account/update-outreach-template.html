{% extends "base.html" %}
{% load widget_tweaks %}
{% block content %}
    <section class="tl-page-stage tl-container py-10 sm:py-16">
        <div class="mx-auto max-w-2xl">
            <div class="tl-panel overflow-hidden">
                <div class="tl-surface-header px-5 py-5 sm:px-6">
                    <p class="tl-eyebrow">Outreach template</p>
                    <h1 class="mt-2 text-2xl font-semibold tracking-tight text-slate-900">Update template</h1>
                </div>
                <form method="post" class="p-5 sm:p-6">
                    {% csrf_token %}
                    <div class="space-y-5">{{ form }}</div>
                    <div class="mt-6 flex justify-end">
                        <button type="submit" class="tl-button-primary">Save changes</button>
                    </div>
                </form>
            </div>
        </div>
    </section>
{% endblock content %}
