{% extends "base.html" %}
{% block content %}
    {% url 'home' as home_url %}
    <section class="tl-page-stage tl-container grid min-h-[calc(100dvh-12rem)] items-center py-12">
        <div class="tl-panel mx-auto max-w-md p-8 text-center">
            <h1 class="text-3xl font-semibold tracking-tight text-slate-900">Sign out?</h1>
            <p class="mt-3 text-sm leading-6 text-slate-600">
                You can sign back in whenever you need to search profiles or manage outreach.
            </p>
            <form method="post"
                  class="mt-6 flex justify-center gap-3"
                  action="{% url 'account_logout' %}">
                {% csrf_token %}
                {% if redirect_field_value %}
                    <input type="hidden"
                           name="{{ redirect_field_name }}"
                           value="{{ redirect_field_value }}" />
                {% endif %}
                <a href="{{ redirect_field_value|default:home_url }}"
                   class="tl-button-secondary">Stay signed in</a>
                <button class="tl-danger-button" type="submit">Sign out</button>
            </form>
        </div>
    </section>
{% endblock content %}
