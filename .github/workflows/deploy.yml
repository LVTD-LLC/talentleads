name: Deploy Prod Server

on:
  push:
    branches:
      - main

env:
  PROJECT_NAME: talentleads

permissions:
  contents: read
  packages: write

jobs:
  build-and-deploy:
    name: Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Prepare image name
        id: image
        shell: bash
        run: echo "image_name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          file: deployment/Dockerfile.server
          tags: ${{ steps.image.outputs.image_name }}

      - name: Deploy to CapRover
        # caprover/deploy-from-github v1.2.0
        uses: caprover/deploy-from-github@c221bd9d1c3a55de4c2b66c0dc4a3972d04c027c
        with:
          server: ${{ secrets.CAPROVER_SERVER }}
          app: ${{ env.PROJECT_NAME }}
          token: "${{ secrets.APP_TOKEN }}"
          image: ${{ steps.image.outputs.image_name }}
